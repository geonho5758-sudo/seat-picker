<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>席決め 자리 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202b; --paper:#f5f0e4; --paper-deep:#e8dfc9;
  --vermilion:#c9452f; --indigo:#2f5d7c; --gold:#d9a441;
  --line:rgba(22,32,43,.14);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Zen Maru Gothic','Gowun Dodum',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.hidden{display:none !important}

/* 상단바 */
.top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 24px;background:var(--ink);color:var(--paper);
}
.top h1{margin:0;font-size:22px;letter-spacing:.04em;font-weight:900}
.top h1 small{font-family:'Gowun Dodum',sans-serif;font-weight:400;font-size:14px;opacity:.7;margin-left:8px}
.prog{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.prog b{color:var(--gold);font-size:24px}

/* 설정 화면 */
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 60px}
.card{background:#fffaf0;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 2px 0 var(--paper-deep)}
.card h2{margin:0 0 6px;font-size:18px}
.card p.sub{margin:0 0 14px;font-family:'Gowun Dodum',sans-serif;opacity:.7;font-size:14px}
textarea{
  width:100%;min-height:200px;resize:vertical;padding:14px;border-radius:12px;
  border:1.5px solid var(--line);background:#fff;font-size:17px;line-height:1.6;
}
textarea:focus,input:focus{outline:2px solid var(--indigo);outline-offset:1px}
.row{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px}
.field{flex:1;min-width:140px}
.field label{display:block;font-size:13px;opacity:.7;margin-bottom:4px}
.field input{
  width:100%;padding:10px 12px;font-size:18px;border-radius:10px;
  border:1.5px solid var(--line);background:#fff;font-weight:700;
}
.info{margin-top:14px;min-height:22px;font-size:15px;font-family:'Gowun Dodum',sans-serif}
.info .err{color:var(--vermilion);font-weight:700}
.info .warn{color:#9a6b12}
.info .ok{color:var(--indigo)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{
  border:0;border-radius:12px;padding:12px 22px;font-weight:700;font-size:16px;
  background:var(--ink);color:var(--paper);transition:transform .08s, opacity .15s;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.red{background:var(--vermilion)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.kbd{font-family:'Gowun Dodum',sans-serif;font-weight:400;font-size:12px;opacity:.65;margin-left:6px}

/* 보드 */
.board-wrap{padding:22px 24px 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.tcard{background:#fffaf0;border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px}
.tcard h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;font-size:18px}
.tcard h3 span{font-size:13px;opacity:.55;font-weight:500;font-variant-numeric:tabular-nums}
.srow{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.tsurf{
  margin:8px 0;height:38px;border-radius:8px;border:1px solid rgba(22,32,43,.22);
  background:linear-gradient(#dcc99f,#cfba8c);box-shadow:inset 0 -3px 0 rgba(22,32,43,.08);
}
.chip{
  min-height:46px;border-radius:12px;display:grid;place-items:center;padding:4px 6px;
  font-size:17px;font-weight:700;text-align:center;word-break:keep-all;
  border:1.5px dashed rgba(22,32,43,.25);background:var(--paper);
}
.chip.on{background:#fff;border:1.5px solid var(--indigo)}
.chip.hid span{opacity:.35;font-weight:900}
.chip.empty{opacity:.35;border-style:dotted;font-weight:500;font-size:14px}
.chip.off{visibility:hidden}
.chip.flash{animation:flash 1.6s ease-out}
@keyframes flash{
  0%{background:var(--gold);transform:scale(1.06)}
  100%{background:#fff;transform:scale(1)}
}
/* 붙인 테이블 */
.scrollx{overflow-x:auto;padding-bottom:6px}
.ring{
  display:grid;grid-template-columns:104px 1fr 104px;gap:10px;min-width:880px;
  max-width:1500px;margin:0 auto;align-items:stretch;
}
.ring.noends{grid-template-columns:1fr}
.ring .chip{font-size:16px}
.rtop,.rbot{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.rend{display:flex;flex-direction:column;justify-content:space-around;gap:8px}
.rsurf{
  display:grid;grid-template-columns:repeat(var(--c),1fr);grid-template-rows:repeat(var(--r),minmax(64px,auto));
  border-radius:10px;border:2px solid rgba(22,32,43,.3);overflow:hidden;
  background:linear-gradient(#dcc99f,#cfba8c);
}
.rsurf .cell{
  border:1px solid rgba(22,32,43,.2);display:grid;place-items:center;
  font-size:13px;opacity:.55;font-weight:700;
}
.cap{margin:12px 0 0;text-align:center;font-size:13px;opacity:.55;font-family:'Gowun Dodum',sans-serif}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;justify-content:center}

/* 팀 나누기 */
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;max-width:1400px;margin:0 auto}
.team{background:#fffaf0;border:1px solid var(--line);border-top:8px solid var(--tc);border-radius:14px;padding:12px 16px 16px}
.team h3{margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;font-size:26px;color:var(--tc)}
.team h3 span{font-size:14px;opacity:.6;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.team .chip.on{border-color:var(--tc)}

/* 게스트 */
.guests{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.guests h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.guests h2 small{font-family:'Gowun Dodum',sans-serif;font-weight:400;font-size:13px;opacity:.65}
.grow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.grow input{
  flex:1;min-width:110px;padding:9px 12px;font-size:16px;border-radius:10px;
  border:1.5px solid var(--line);background:#fff;
}
.grow .mid{font-size:14px;opacity:.7;font-family:'Gowun Dodum',sans-serif;white-space:nowrap}
.grow .gx{border:0;background:transparent;font-size:20px;opacity:.5;padding:4px 8px}
.grow .gx:hover{opacity:1}
.grow .gstat{flex-basis:100%;font-size:13px;font-family:'Gowun Dodum',sans-serif;margin-top:-4px}
.grow .gstat.bad{color:var(--vermilion)}
.grow .gstat.good{color:var(--indigo)}
.btn.small{padding:8px 14px;font-size:14px}

/* 모드 선택 */
.seg{display:flex;gap:6px;margin-bottom:16px;background:var(--paper-deep);padding:4px;border-radius:12px}
.seg button{
  flex:1;border:0;background:transparent;padding:10px 6px;border-radius:9px;font-weight:700;font-size:14px;
}
.seg button.on{background:var(--ink);color:var(--paper)}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;font-family:'Gowun Dodum',sans-serif}
.chk input{width:18px;height:18px}

/* 스포트라이트 */
#spot{
  position:fixed;inset:0;z-index:50;display:none;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  background:rgba(22,32,43,.94);color:var(--paper);padding:20px;cursor:pointer;
}
#spot.on{display:flex}
#spot .lab{font-size:clamp(20px,3vw,34px);opacity:.8;margin-bottom:18px;font-weight:700}
#spot .nm{
  font-family:'Nanum Myeongjo','Zen Maru Gothic',serif;font-weight:800;
  font-size:clamp(44px,11vw,150px);line-height:1.1;word-break:keep-all;
  min-height:1.2em;
}
#spot .nm.roll{opacity:.55}
#spot .nm.land{color:var(--gold);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#spot .tb{
  margin-top:22px;font-size:clamp(26px,5vw,60px);font-weight:900;color:var(--vermilion);
  background:var(--paper);border-radius:999px;padding:6px 36px;opacity:0;transform:translateY(10px);
  transition:all .35s;
}
#spot .tb.show{opacity:1;transform:none}
#spot .hint{position:absolute;bottom:22px;font-size:14px;opacity:.5}

@media (max-width:640px){
  .top{padding:12px 16px}
  .board-wrap{padding:16px 14px 26px}
  .grid{grid-template-columns:1fr 1fr}
  .wrap{padding:18px 14px 50px}
}
</style>
</head>
<body>

<!-- 설정 화면 -->
<section id="setup">
  <div class="top"><h1>席決め<small>자리 뽑기</small></h1></div>
  <div class="wrap">
    <div class="card">
      <div class="seg" id="seg">
        <button type="button" data-m="split" class="on">따로 앉기 (테이블마다)</button>
        <button type="button" data-m="joined">붙여서 앉기 (식사 때)</button>
        <button type="button" data-m="team">팀 나누기 (게임용)</button>
      </div>
      <h2>참석자 이름</h2>
      <p class="sub">한 줄에 한 명씩 적거나 쉼표로 구분해도 돼요</p>
      <textarea id="names" placeholder="예)&#10;민수&#10;지은&#10;하늘" spellcheck="false"></textarea>
      <div class="guests">
        <h2>게스트 <small>부른 사람과 같은 팀 · 같은 테이블 · 가까운 자리(옆 또는 맞은편)로 배정돼요</small></h2>
        <div id="guestRows"></div>
        <button type="button" class="btn ghost small" id="addGuest">+ 게스트 추가</button>
      </div>
      <div class="row">
        <div class="field">
          <label for="tables" id="tablesLab">테이블 수 (비우면 자동)</label>
          <input id="tables" type="number" min="1" max="30" inputmode="numeric">
        </div>
        <div class="field" id="seatsField">
          <label for="seats">테이블당 자리</label>
          <input id="seats" type="number" min="1" max="30" value="4" inputmode="numeric">
        </div>
        <div class="field" id="rowsField">
          <label for="rows">몇 줄로 붙일지</label>
          <input id="rows" type="number" min="1" max="10" value="2" inputmode="numeric">
        </div>
      </div>
      <label class="chk" id="endsField"><input type="checkbox" id="ends" checked>양 끝자리도 쓸 수 있게 (긴 쪽이 다 차면 그때 채워요)</label>
      <div class="info" id="info"></div>
      <div class="btns">
        <button class="btn red" id="startBtn">뽑기 시작</button>
        <button class="btn ghost hidden" id="resumeBtn">이전 결과 이어서 보기</button>
      </div>
    </div>
  </div>
</section>

<!-- 보드 화면 -->
<section id="board" class="hidden">
  <div class="top">
    <h1>席決め<small>자리 뽑기</small></h1>
    <div class="prog"><b id="pNow">0</b> / <span id="pAll">0</span></div>
  </div>
  <div class="board-wrap">
    <div id="stage"></div>
    <div class="bar">
      <button class="btn red" id="drawBtn">한 명 뽑기<span class="kbd">Space</span></button>
      <button class="btn" id="allBtn">전부 보기<span class="kbd">Shift+Enter</span></button>
      <button class="btn ghost" id="reBtn">다시 섞기<span class="kbd">Shift+R</span></button>
      <button class="btn ghost" id="backBtn">설정으로<span class="kbd">E</span></button>
    </div>
  </div>
</section>

<!-- 스포트라이트 -->
<div id="spot">
  <div class="lab" id="sLab"></div>
  <div class="nm" id="sName"></div>
  <div class="tb" id="sTb"></div>
  <div class="hint">클릭하거나 Space로 넘기기</div>
</div>

<script>
// <PURE>
function range(n){ return Array.from({length:n}, (_,i)=>i); }
function randInt(n){
  if(n<=1) return 0;
  const g = (typeof crypto!=='undefined' && crypto.getRandomValues) ? crypto : null;
  if(!g) return Math.floor(Math.random()*n);
  const max = Math.floor(0x100000000/n)*n;
  const buf = new Uint32Array(1);
  let x;
  do{ g.getRandomValues(buf); x = buf[0]; }while(x>=max);
  return x % n;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = randInt(i+1);
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function parseNames(text){
  return String(text||'').split(/[\n\r,，、;；]+/).map(s=>s.trim()).filter(Boolean);
}
function findDup(names){
  const seen = new Set(), dup = new Set();
  names.forEach(n=>{ if(seen.has(n)) dup.add(n); seen.add(n); });
  return Array.from(dup);
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// 게스트 묶음: 부른 사람 + 그 사람이 부른 게스트들 → [[부른사람, 게스트1, 게스트2], ...]
function bundleList(pairs){
  const m = new Map();
  pairs.forEach(p=>{ if(!m.has(p.host)) m.set(p.host,[p.host]); m.get(p.host).push(p.guest); });
  return Array.from(m.values());
}
function tryMake(fn){
  for(let i=0;i<80;i++){ const r = fn(); if(r) return r; }
  return null;
}
// [따로 앉기 / 팀 나누기] 테이블(팀) 인원을 최대한 고르게(차이 1명 이내) 나눈 뒤 순서를 섞어서 반환
// 묶음(bundles)은 항상 같은 테이블(팀)에 들어감. 못 맞추면 null
// seat = (table-1)*S + 테이블 안 자리번호(0부터)
function makeAssignOnce(names, T, S, bundles){
  const n = names.length;
  const base = Math.floor(n/T), extra = n % T;
  const order = shuffle(range(T));
  const cap = new Array(T).fill(base);
  for(let i=0;i<extra;i++) cap[order[i]]++;
  const inB = new Set();
  bundles.forEach(b=>b.forEach(x=>inB.add(x)));
  const singles = names.filter(x=>!inB.has(x));
  const tableOf = new Map();
  const bs = shuffle(bundles).sort((a,b)=>b.length-a.length);
  for(const b of bs){
    const cand = range(T).filter(t=>cap[t]>=b.length);
    if(!cand.length) return null;
    const t = cand[randInt(cand.length)];
    b.forEach(x=>tableOf.set(x,t));
    cap[t] -= b.length;
  }
  const slots = [];
  cap.forEach((c,t)=>{ for(let k=0;k<c;k++) slots.push(t); });
  const slotsS = shuffle(slots);
  if(slotsS.length !== singles.length) return null;
  shuffle(singles).forEach((x,i)=>tableOf.set(x,slotsS[i]));
  const pools = range(T).map(()=>shuffle(range(S)));
  const ptr = new Array(T).fill(0);
  return shuffle(names).map(name=>{
    const t = tableOf.get(name);
    const s = pools[t][ptr[t]++];
    return {name:name, table:t+1, seat:t*S+s};
  });
}
function makeAssign(names, T, S, bundles){
  return tryMake(()=>makeAssignOnce(names, T, S, bundles||[]));
}
// [붙여서 앉기] 긴 쪽(위/아래) 좌석 수 = 한 줄 칸 수 * 테이블당 한쪽 자리
function joinedGeom(T, R, S){
  const C = Math.ceil(T/R), per = Math.floor(S/2);
  return {C:C, per:per, L:C*per};
}
// 긴 쪽 좌석의 "옆(같은 줄 양옆)"과 "맞은편" 좌석 id
function seatNeighbors(id, L){
  if(id < 0 || id >= 2*L) return [];
  const row = id < L ? 0 : 1, i = id - row*L, out = [];
  if(i > 0) out.push(id-1);
  if(i < L-1) out.push(id+1);
  out.push(row === 0 ? id+L : id-L);
  return out;
}
// 좌석 id: 0..L-1 위쪽(왼→오), L..2L-1 아래쪽(왼→오), 2L..2L+R-1 왼쪽 끝(위→아래), 그 뒤 R개 오른쪽 끝
// 긴 쪽 먼저 쓰고, 사람이 더 많을 때만 끝자리를 채움 / 묶음은 서로 옆 또는 맞은편에 앉힘
function makeAssignJoinedOnce(names, T, R, S, bundles){
  const g = joinedGeom(T,R,S), L = g.L, longN = 2*L, n = names.length;
  const ends = range(2*R).map(i=>longN+i);
  const inB = new Set();
  bundles.forEach(b=>b.forEach(x=>inB.add(x)));
  const singles = names.filter(x=>!inB.has(x));
  const free = new Set(range(longN));
  const seatOf = new Map();
  for(const b of shuffle(bundles)){
    let placed = null;
    for(let attempt=0; attempt<200 && !placed; attempt++){
      const fl = Array.from(free);
      if(!fl.length) break;
      const used = [fl[randInt(fl.length)]];
      let ok = true;
      for(let k=1;k<b.length && ok;k++){
        const cand = [];
        used.forEach(u=>seatNeighbors(u,L).forEach(v=>{
          if(free.has(v) && used.indexOf(v) < 0 && cand.indexOf(v) < 0) cand.push(v);
        }));
        if(!cand.length) ok = false; else used.push(cand[randInt(cand.length)]);
      }
      if(ok) placed = used;
    }
    if(!placed) return null;
    placed.forEach((sid,k)=>{ free.delete(sid); seatOf.set(b[k], sid); });
  }
  const remaining = Array.from(free);
  const seats = n <= longN
    ? shuffle(remaining).slice(0, singles.length)
    : remaining.concat(shuffle(ends).slice(0, n-longN));
  if(seats.length < singles.length) return null;
  shuffle(singles).forEach((x,i)=>seatOf.set(x, seats[i]));
  return shuffle(names).map(name=>({name:name, seat:seatOf.get(name)}));
}
function makeAssignJoined(names, T, R, S, bundles){
  return tryMake(()=>makeAssignJoinedOnce(names, T, R, S, bundles||[]));
}
// </PURE>

(function(){
  const KEY = 'seatpicker_v2';
  const $ = id => document.getElementById(id);
  let mode = 'split';
  let tablesManual = false;
  const DEF_VALS = {split:{tables:'',manual:false}, joined:{tables:'10',manual:true}, team:{tables:'2',manual:true}};
  let modeVals = JSON.parse(JSON.stringify(DEF_VALS));
  const TEAM_COL = ['#c9452f','#2f5d7c','#b8861f','#4f8a5b','#7a5c99','#c26b9a','#3d8f8f','#8a6a3b'];
  let state = {mode:'split',T:0,S:0,R:0,endsOn:false,assign:[],revealed:0,bundles:[]};
  let busy = false, landed = false, rollIv = null, landTm = null, doneTm = null;

  /* ---------- 저장 / 불러오기 ---------- */
  function save(){
    try{
      modeVals[mode] = {tables:$('tables').value, manual:tablesManual};
      localStorage.setItem(KEY, JSON.stringify({
        names: $('names').value, mode: mode, modeVals: modeVals,
        seats: $('seats').value, rows: $('rows').value, ends: $('ends').checked,
        guests: readGuestRows().map(r=>({g:r.g, h:r.h})),
        game: state.assign.length ? state : null
      }));
    }catch(e){}
  }
  function load(){
    try{ const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  }

  /* ---------- 게스트 입력 ---------- */
  function addGuestRow(g, h){
    const d = document.createElement('div');
    d.className = 'grow';
    d.innerHTML = '<input class="g-name" placeholder="게스트 이름" spellcheck="false">'
      + '<span class="mid">을(를) 부른 사람</span>'
      + '<input class="g-host" placeholder="명단에 적은 이름 그대로" spellcheck="false">'
      + '<button type="button" class="gx" title="삭제">×</button>'
      + '<div class="gstat"></div>';
    d.querySelector('.g-name').value = g || '';
    d.querySelector('.g-host').value = h || '';
    $('guestRows').appendChild(d);
  }
  function readGuestRows(){
    return Array.from(document.querySelectorAll('#guestRows .grow')).map(el=>({
      el: el,
      g: el.querySelector('.g-name').value.trim(),
      h: el.querySelector('.g-host').value.trim()
    }));
  }

  /* ---------- 설정 화면 ---------- */
  function applyModeUI(){
    document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on', b.dataset.m === mode));
    $('rowsField').classList.toggle('hidden', mode !== 'joined');
    $('endsField').classList.toggle('hidden', mode !== 'joined');
    $('seatsField').classList.toggle('hidden', mode === 'team');
    $('tablesLab').textContent = mode === 'split' ? '테이블 수 (비우면 자동)' : (mode === 'joined' ? '붙일 테이블 수' : '팀 수');
  }
  function setMode(m){
    if(m === mode) return;
    modeVals[mode] = {tables:$('tables').value, manual:tablesManual};
    mode = m;
    $('tables').value = modeVals[m].tables;
    tablesManual = modeVals[m].manual;
    applyModeUI(); updateInfo(); save();
  }
  function readSetup(){
    const main = parseNames($('names').value);
    const rows = readGuestRows();
    const complete = rows.filter(r=>r.g && r.h);
    const guestSet = new Set(rows.filter(r=>r.g).map(r=>r.g));
    const mainOnly = main.filter(x=>!guestSet.has(x));
    const gNames = [];
    complete.forEach(r=>{ if(gNames.indexOf(r.g) < 0) gNames.push(r.g); });
    const names = mainOnly.concat(gNames);
    const gIssues = [];
    rows.forEach(r=>{
      let msg = '', good = false;
      if(!r.g && !r.h) msg = '';
      else if(r.g && !r.h) msg = '부른 사람 이름을 적어줘요';
      else if(!r.g && r.h) msg = '게스트 이름을 적어줘요';
      else if(r.g === r.h) msg = '게스트와 부른 사람이 같은 이름이에요';
      else if(mainOnly.indexOf(r.h) < 0) msg = "'"+r.h+"'이(가) 명단에 없어요 (명단에 적은 이름 그대로 적어줘요)";
      else good = true;
      const st = r.el.querySelector('.gstat');
      st.textContent = good ? '✓ 명단에서 찾았어요' : msg;
      st.className = 'gstat' + (good ? ' good' : (msg ? ' bad' : ''));
      if(msg) gIssues.push(msg);
    });
    const pairs = complete.filter(r=>r.g !== r.h && mainOnly.indexOf(r.h) >= 0).map(r=>({guest:r.g, host:r.h}));
    const S = parseInt($('seats').value, 10) || 0;
    const R = parseInt($('rows').value, 10) || 0;
    let T;
    if(mode === 'split'){
      const tv = $('tables').value.trim();
      if(tv === '') tablesManual = false;
      T = tablesManual ? (parseInt(tv,10) || 0) : ((S && names.length) ? Math.ceil(names.length/S) : 0);
    }else{
      T = parseInt($('tables').value, 10) || 0;
    }
    return {names, T, S: mode === 'team' ? names.length : S, R, ends: $('ends').checked, pairs, gIssues, nGuest: gNames.length};
  }
  function updateInfo(){
    const {names, T, S, R, ends, pairs, gIssues, nGuest} = readSetup();
    if(mode === 'split') $('tables').value = (!tablesManual && T) ? T : (!tablesManual ? '' : $('tables').value);
    const n = names.length, dup = findDup(names), msgs = [];
    let ok = true;
    const err = t => { ok = false; msgs.push('<span class="err">'+t+'</span>'); };
    if(gIssues.length) err('게스트 칸을 확인해줘요 (위 빨간 글씨 참고)');
    if(n < 2) err('이름을 2명 이상 적어줘요');
    else if(mode === 'team'){
      if(!T) err('팀 수를 적어줘요');
      else if(T > n) err('팀 수가 인원보다 많아요');
      else{
        const lo = Math.floor(n/T), hi = Math.ceil(n/T);
        msgs.push('<span class="ok">'+n+'명 · '+T+'팀 · 팀마다 '+(lo===hi ? lo+'명씩' : lo+'~'+hi+'명씩')+' (인원이 안 나눠지면 어느 팀이 한 명 더 가질지도 랜덤이에요)</span>');
      }
    }
    else if(mode === 'split'){
      if(!T || !S) err('테이블 수와 자리 수를 확인해줘요');
      else if(n > T*S) err('자리가 모자라요 ('+n+'명 / 총 '+(T*S)+'자리)');
      else{
        const lo = Math.floor(n/T), hi = Math.ceil(n/T);
        msgs.push('<span class="ok">'+n+'명 · 테이블 '+T+'개 · 테이블마다 '+(lo===hi ? lo+'명씩' : lo+'~'+hi+'명씩')+' 앉아요</span>');
      }
    }else{
      if(!T || !R || S < 2) err('테이블 수 · 줄 수 · 테이블당 자리(2 이상)를 확인해줘요');
      else if(T % R) err('테이블 '+T+'개는 '+R+'줄로 딱 나눠지지 않아요');
      else{
        const g = joinedGeom(T,R,S), longN = 2*g.L, cap = longN + (ends ? 2*R : 0);
        if(n > cap) err('자리가 모자라요 ('+n+'명 / 최대 '+cap+'자리)');
        else{
          let t = n+'명 · 테이블 '+T+'개를 '+R+'줄 × '+g.C+'칸으로 붙여요 · 긴 쪽 '+longN+'자리';
          if(ends) t += ' + 끝자리 '+(2*R)+'자리 (최대 '+cap+'명)';
          if(n < longN) t += ' · '+(longN-n)+'자리는 비어요';
          else if(n > longN) t += ' · 끝자리 '+(n-longN)+'자리 사용';
          msgs.push('<span class="ok">'+t+'</span>');
        }
      }
    }
    if(ok && pairs.length){
      const test = buildAssign(mode, names, T, S, R, bundleList(pairs));
      if(!test) err('게스트를 부른 사람과 같은 팀/테이블/가까운 자리로 묶을 수 없어요 (팀이나 테이블 인원이 너무 적은지 확인해줘요)');
      else msgs.push('<span class="ok">게스트 '+nGuest+'명 포함 · 부른 사람과 같은 '+(mode==='team'?'팀':(mode==='split'?'테이블':'옆/맞은편 자리'))+'로 배정해요</span>');
    }
    if(dup.length) msgs.push('<span class="warn">이름이 겹쳐요: '+dup.map(esc).join(', ')+' (동명이인이면 구분되게 바꿔주면 좋아요)</span>');
    $('info').innerHTML = msgs.join('<br>');
    $('startBtn').disabled = !ok;
    return ok;
  }
  function buildAssign(m, names, T, S, R, bundles){
    if(m === 'joined') return makeAssignJoined(names, T, R, S, bundles);
    return makeAssign(names, T, m === 'team' ? names.length : S, bundles);
  }
  function startGame(){
    if(!updateInfo()) return;
    const {names, T, S, R, pairs} = readSetup();
    const bundles = bundleList(pairs);
    const endsOn = mode === 'joined' && names.length > 2*joinedGeom(T,R,S).L;
    const assign = buildAssign(mode, names, T, S, R, bundles);
    if(!assign){ updateInfo(); return; }
    state = {mode:mode, T:T, S:S, R:R, endsOn:endsOn, assign: assign, revealed:0, bundles:bundles};
    save();
    showBoard();
  }
  function showSetup(){
    stopAnim();
    $('board').classList.add('hidden');
    $('setup').classList.remove('hidden');
    $('resumeBtn').classList.toggle('hidden', !state.assign.length);
    applyModeUI();
    updateInfo();
  }

  /* ---------- 보드 ---------- */
  function showBoard(){
    $('setup').classList.add('hidden');
    $('board').classList.remove('hidden');
    renderBoard(-1);
  }
  function describe(a){
    const id = a.seat;
    if(state.mode === 'team') return a.table+'팀';
    if(state.mode === 'split') return a.table+'번 테이블';
    const L = joinedGeom(state.T, state.R, state.S).L, R = state.R;
    if(id < L) return '위쪽 줄 '+(id+1)+'번째 자리';
    if(id < 2*L) return '아래쪽 줄 '+(id-L+1)+'번째 자리';
    if(id < 2*L+R) return '왼쪽 끝 '+(id-2*L+1)+'번째 자리';
    return '오른쪽 끝 '+(id-2*L-R+1)+'번째 자리';
  }
  function renderBoard(flashIdx){
    const st = state, total = st.assign.length, revealed = st.revealed, done = revealed >= total;
    const bySeat = {};
    st.assign.forEach((a,i)=>{ bySeat[a.seat] = i; });
    function chip(id, enabled){
      const idx = bySeat[id];
      if(idx !== undefined && idx < revealed)
        return '<div class="chip on'+(idx===flashIdx?' flash':'')+'"><span>'+esc(st.assign[idx].name)+'</span></div>';
      if(enabled === false) return '<div class="chip off"></div>';
      if(idx === undefined && done) return '<div class="chip empty"><span>빈자리</span></div>';
      return '<div class="chip hid"><span>?</span></div>';
    }
    let html = '';
    if(st.mode === 'team'){
      const T = st.T, cnt = new Array(T+1).fill(0), shown = new Array(T+1).fill(0);
      const members = range(T+1).map(()=>[]);
      st.assign.forEach((a,i)=>{ cnt[a.table]++; if(i < revealed) shown[a.table]++; members[a.table].push(i); });
      html += '<div class="tgrid">';
      for(let t=1;t<=T;t++){
        html += '<div class="team" style="--tc:'+TEAM_COL[(t-1)%TEAM_COL.length]+'"><h3>'+t+'팀<span>'+shown[t]+' / '+cnt[t]+'</span></h3><div class="mem">'
          + members[t].map(i => i < revealed
              ? '<div class="chip on'+(i===flashIdx?' flash':'')+'"><span>'+esc(st.assign[i].name)+'</span></div>'
              : '<div class="chip hid"><span>?</span></div>').join('')
          + '</div></div>';
      }
      html += '</div>';
    }else if(st.mode === 'split'){
      const T = st.T, S = st.S, topN = Math.ceil(S/2), botN = S - topN;
      const cnt = new Array(T+1).fill(0), shown = new Array(T+1).fill(0);
      st.assign.forEach((a,i)=>{ cnt[a.table]++; if(i < revealed) shown[a.table]++; });
      html += '<div class="grid">';
      for(let t=1;t<=T;t++){
        const ids = range(S).map(s=>(t-1)*S+s);
        html += '<div class="tcard"><h3>'+t+'번 테이블<span>'+shown[t]+' / '+cnt[t]+'</span></h3>'
          + '<div class="srow" style="--n:'+topN+'">'+ids.slice(0,topN).map(i=>chip(i)).join('')+'</div>'
          + '<div class="tsurf"></div>'
          + (botN ? '<div class="srow" style="--n:'+botN+'">'+ids.slice(topN).map(i=>chip(i)).join('')+'</div>' : '')
          + '</div>';
      }
      html += '</div>';
    }else{
      const g = joinedGeom(st.T, st.R, st.S), L = g.L, R = st.R, on = st.endsOn;
      const top = range(L).map(i=>chip(i));
      const bot = range(L).map(i=>chip(L+i));
      const cells = range(st.T).map(i=>'<div class="cell">'+(i+1)+'</div>').join('');
      html += '<div class="scrollx"><div class="ring'+(on?'':' noends')+'">';
      if(on) html += '<div></div>';
      html += '<div class="rtop" style="--n:'+L+'">'+top.join('')+'</div>';
      if(on) html += '<div></div>';
      if(on) html += '<div class="rend">'+range(R).map(i=>chip(2*L+i)).join('')+'</div>';
      html += '<div class="rsurf" style="--c:'+g.C+';--r:'+R+'">'+cells+'</div>';
      if(on) html += '<div class="rend">'+range(R).map(i=>chip(2*L+R+i)).join('')+'</div>';
      if(on) html += '<div></div>';
      html += '<div class="rbot" style="--n:'+L+'">'+bot.join('')+'</div>';
      if(on) html += '<div></div>';
      html += '</div></div><p class="cap">테이블 '+st.T+'개를 붙인 모습이에요 · 위/아래는 이 화면 기준이고 어느 쪽이 위인지는 현장에서 정해주면 돼요</p>';
    }
    $('stage').innerHTML = html;
    $('pNow').textContent = revealed;
    $('pAll').textContent = total;
    $('drawBtn').disabled = done;
    $('allBtn').disabled = done;
  }

  /* ---------- 뽑기 연출 ---------- */
  function stopAnim(){
    if(rollIv){ clearInterval(rollIv); rollIv = null; }
    if(landTm){ clearTimeout(landTm); landTm = null; }
    if(doneTm){ clearTimeout(doneTm); doneTm = null; }
    busy = false; landed = false;
    $('spot').classList.remove('on');
  }
  function draw(){
    if(busy){ advance(); return; }
    if(state.revealed >= state.assign.length) return;
    busy = true; landed = false;
    const pool = state.assign.slice(state.revealed).map(a=>a.name);
    $('sLab').textContent = (state.revealed+1)+'번째 사람은';
    $('sName').className = 'nm roll';
    $('sName').textContent = pool[randInt(pool.length)];
    $('sTb').className = 'tb';
    $('sTb').textContent = '';
    $('spot').classList.add('on');
    rollIv = setInterval(()=>{ $('sName').textContent = pool[randInt(pool.length)]; }, 70);
    landTm = setTimeout(land, 1100);
  }
  function land(){
    if(landed) return;
    landed = true;
    if(rollIv){ clearInterval(rollIv); rollIv = null; }
    if(landTm){ clearTimeout(landTm); landTm = null; }
    const a = state.assign[state.revealed];
    $('sName').className = 'nm land';
    $('sName').textContent = a.name;
    $('sTb').textContent = describe(a);
    $('sTb').style.color = state.mode === 'team' ? TEAM_COL[(a.table-1)%TEAM_COL.length] : '';
    $('sTb').className = 'tb show';
    doneTm = setTimeout(finish, 1800);
  }
  function advance(){ if(!landed) land(); else finish(); }
  function finish(){
    if(!busy) return;
    const idx = state.revealed;
    stopAnim();
    state.revealed = idx + 1;
    save();
    renderBoard(idx);
  }
  function revealAll(){
    if(busy) stopAnim();
    if(state.revealed >= state.assign.length) return;
    state.revealed = state.assign.length;
    save();
    renderBoard(-1);
  }
  function reshuffle(){
    if(busy) stopAnim();
    if(state.revealed > 0 && !confirm('지금까지 뽑은 결과가 사라지고 처음부터 다시 섞여요 괜찮아요?')) return;
    const names = state.assign.map(a=>a.name);
    const again = buildAssign(state.mode, names, state.T, state.S, state.R, state.bundles || []);
    if(!again) return;
    state.assign = again;
    state.revealed = 0;
    save();
    renderBoard(-1);
  }

  /* ---------- 이벤트 ---------- */
  $('names').addEventListener('input', ()=>{ updateInfo(); save(); });
  $('guestRows').addEventListener('input', ()=>{ updateInfo(); save(); });
  $('guestRows').addEventListener('click', e=>{
    if(e.target.classList.contains('gx')){ e.target.closest('.grow').remove(); updateInfo(); save(); }
  });
  $('addGuest').addEventListener('click', ()=>{ addGuestRow('',''); save(); });
  $('seats').addEventListener('input', ()=>{ updateInfo(); save(); });
  $('rows').addEventListener('input', ()=>{ updateInfo(); save(); });
  $('ends').addEventListener('change', ()=>{ updateInfo(); save(); });
  $('tables').addEventListener('input', ()=>{
    tablesManual = (mode !== 'split') ? true : $('tables').value.trim() !== '';
    updateInfo(); save();
  });
  document.querySelectorAll('#seg button').forEach(b=>b.addEventListener('click', ()=>setMode(b.dataset.m)));
  $('startBtn').addEventListener('click', startGame);
  $('resumeBtn').addEventListener('click', showBoard);
  $('drawBtn').addEventListener('click', draw);
  $('allBtn').addEventListener('click', revealAll);
  $('reBtn').addEventListener('click', reshuffle);
  $('backBtn').addEventListener('click', showSetup);
  $('spot').addEventListener('click', advance);

  document.addEventListener('keydown', e=>{
    const tag = (e.target && e.target.tagName) || '';
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    if($('board').classList.contains('hidden')) return;
    if(e.code === 'Space'){
      e.preventDefault();
      if(e.repeat) return;
      draw();
    }else if(e.code === 'Enter' && e.shiftKey){
      e.preventDefault(); revealAll();
    }else if(e.code === 'Enter' && busy){
      e.preventDefault(); advance();
    }else if(e.code === 'KeyR' && e.shiftKey){
      e.preventDefault(); reshuffle();
    }else if(e.code === 'KeyE' && !e.shiftKey){
      e.preventDefault(); showSetup();
    }
  });

  /* ---------- 시작 ---------- */
  const saved = load();
  if(saved){
    $('names').value = saved.names || '';
    $('seats').value = saved.seats || 4;
    $('rows').value = saved.rows || 2;
    $('ends').checked = saved.ends !== false;
    (saved.guests && saved.guests.length ? saved.guests : [{g:'',h:''},{g:'',h:''}]).forEach(x=>addGuestRow(x.g, x.h));
    if(saved.modeVals) modeVals = Object.assign({}, DEF_VALS, saved.modeVals);
    mode = (saved.mode === 'joined' || saved.mode === 'team') ? saved.mode : 'split';
    $('tables').value = modeVals[mode].tables;
    tablesManual = !!modeVals[mode].manual;
    if(saved.game && saved.game.assign && saved.game.assign.length && saved.game.mode) state = saved.game;
  }else{
    $('tables').value = modeVals[mode].tables;
    addGuestRow('',''); addGuestRow('','');
  }
  showSetup();
})();
</script>
</body>
</html>
